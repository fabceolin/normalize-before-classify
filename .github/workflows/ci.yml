# The clean-machine proof of the claims this repository makes about itself.
#
# Until this file existed, nothing in the repository would ever go red: the five smoke tests were
# deselected by `addopts` on every run since the marker was created, and the two production pin
# resolvers are named by exactly one test, which is one of those five. That is why so many defects
# survived here with a demonstrated regression -- there was no runner to demonstrate it to.
#
# Three properties, three jobs, and the split is deliberate:
#
#   unit     -- the offline suite on a clean CPU-only machine, which is SC3's promise.
#   lockfile -- `uv sync --locked`, because `uv sync --frozen` DOES NOT VALIDATE. Verified
#               against uv 0.12.5: with a dependency added to pyproject.toml and never re-locked,
#               `--frozen` exits 0 and silently installs the stale lock. The documented
#               reproduction command stays `--frozen` (it is what a stranger runs, and it is
#               offline); the gate that refuses drift is a separate job.
#   smoke    -- the only tests that ever touch a pinned artifact. Deselected by default, so
#               without this job they have never executed anywhere.
#
# It never writes the published artifacts. A smoke run that overwrote results/results.json or
# README.md would replace the headline table with a 20-item one that looks structurally identical,
# with a small n as the only tell.

name: CI

on:
  push:
    branches: [main]
  pull_request:

# Linux only, and `platform.py` enforces it: the floor's evidence is a glibc version and
# manylinux wheel tags, both Linux facts, so every other platform aborts naming itself rather
# than being approved by a check that cannot speak about it.
env:
  UV_VERSION: "0.12.5"

jobs:
  unit:
    name: offline unit suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the pinned uv
        uses: astral-sh/setup-uv@v5
        with:
          # pyproject pins `required-version = "==0.12.5"`, so any other uv refuses to run in
          # this project at all. Pinning the action to the same value keeps CI from being the
          # one place a different resolver is allowed.
          version: ${{ env.UV_VERSION }}

      - name: Sync the frozen environment
        run: uv sync --frozen --extra build --group dev

      - name: Run the offline unit suite
        run: uv run pytest

      - name: Prove the platform abort fires
        # A floor above the runner's own, so the gate is exercised rather than assumed.
        #
        # The EXIT CODE is checked, not merely non-zero-ness. `if ...; then fail; fi` was green
        # whether the abort fired or the command died of a typo, an import error or a missing
        # module -- a gate that passes on its own failure. 3 is UnsupportedPlatform; 2 is a usage
        # error, which is what a typo in this very step produces.
        run: |
          set +e
          uv run python -m nbc.platform --require-glibc 99.0
          status=$?
          set -e
          if [ "$status" -ne 3 ]; then
            echo "::error::expected exit 3 (UnsupportedPlatform), got $status"
            exit 1
          fi

      - name: Prove the gate hook cannot disable itself
        # The flag above can only RAISE the floor. Lowering it would pass on every machine the
        # real floor passes on, silently, while still publishing a reason string claiming the
        # floor went up. Exit 2 is the usage error that refusal produces.
        run: |
          set +e
          uv run python -m nbc.platform --require-glibc 2.0
          status=$?
          set -e
          if [ "$status" -ne 2 ]; then
            echo "::error::--require-glibc accepted a floor at or below the declared one"
            exit 1
          fi

      - name: Verify the pins resolve
        # AD-16 step 1, which the entrypoint will run before any inference. `--verify` is the
        # half that asks: without it the command loads and validates the FILE and prints its run
        # fields, which is not the same claim -- and both this step's name and the README said it
        # was. It also reports which artifacts were checked against the hub and which were read
        # off a cache directory name, and those are different guarantees.
        run: uv run python -m nbc.pins --verify

      - name: Verify the layer is inside its declared size budget
        # NFR5, made falsifiable. Checks three things against each other in one pass: the budget
        # the README states, the budget `SizeBudget` declares, and the layer as measured. Editing
        # any one of the three without the other two fails here.
        run: uv run python -m nbc.report.size_budget

      - name: Prove the size-budget abort fires
        # The EXIT CODE, not non-zero-ness: 14 is SizeBudgetViolated and 2 is a usage error, which
        # is what a typo in this very step produces. A budget nobody has seen refuse anything is a
        # number in a file.
        run: |
          set +e
          uv run python -m nbc.report.size_budget --max-total-code-lines 1
          status=$?
          set -e
          if [ "$status" -ne 14 ]; then
            echo "::error::expected exit 14 (SizeBudgetViolated), got $status"
            exit 1
          fi

      - name: Prove the size-budget flag cannot loosen the budget
        # The same shape as `--require-glibc`: a flag that could raise the ceiling would pass on
        # every layer the real ceiling passes on, silently. Refusing that is argparse's exit 2.
        run: |
          set +e
          uv run python -m nbc.report.size_budget --max-total-code-lines 1000000
          status=$?
          set -e
          if [ "$status" -ne 2 ]; then
            echo "::error::--max-total-code-lines accepted a budget above the declared one"
            exit 1
          fi

      - name: Refuse a dirty tree
        # The suite must not write into the working tree. A test that leaves a file behind is a
        # test that could have left a *different* file behind -- and `git diff --exit-code` is
        # blind to a file that was CREATED, which is the shape a stray write actually takes.
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain)" || {
            echo "::error::the run left files behind:"; git status --porcelain; exit 1; }

  lockfile:
    name: lockfile is in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}

      - name: Refuse a lockfile that does not match pyproject.toml
        # `--locked` is the flag that fails; `--frozen` is the flag that installs silently. The
        # difference is the whole reason this is its own job.
        run: uv sync --locked --extra build --group dev

  smoke:
    name: model-touching smoke run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}

      - name: Sync the frozen environment
        run: uv sync --frozen --extra build --group dev

      - name: Cache the Hugging Face hub
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          # The pins are the cache identity: a pin change must not be served a stale artifact.
          key: hf-${{ hashFiles('pins.toml') }}

      - name: Run the smoke tests
        # The only tests that open a pinned graph. They are deselected by `addopts`, so this is
        # the one place they run.
        run: uv run pytest -m smoke

      - name: Prove the gold-label abort fires on the real pool
        # FR4's second case, end to end, against the pinned dataset itself. The pool carries two
        # texts at both labels, so the corpus build STOPS -- and that is what this step asserts.
        # Exit 16 is LabelContradiction; 2 is a usage error, which is what a typo in this very
        # step produces, and 0 would mean the corpus was built.
        #
        # WHEN THE CONTRADICTIONS ARE RESOLVED, THIS STEP CHANGES WITH THEM. Resolving them is a
        # human decision about two rows in a pinned dataset, and this step is what keeps that
        # decision from being made silently: whoever makes it has to come here and say what the
        # build is expected to do instead.
        run: |
          set +e
          uv run python -m nbc.corpus.build build-attack
          status=$?
          set -e
          if [ "$status" -ne 16 ]; then
            echo "::error::expected exit 16 (LabelContradiction), got $status"
            exit 1
          fi

      - name: Refuse a dirty tree
        # CI never writes the published artifacts. A smoke run that overwrote
        # results/results.json or README.md would ship a 20-item table that looks structurally
        # identical to the headline one, with a small n as the only tell. Untracked files count:
        # `git diff` cannot see a file that did not exist before the run.
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain)" || {
            echo "::error::the run left files behind:"; git status --porcelain; exit 1; }
