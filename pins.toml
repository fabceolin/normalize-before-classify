# The SECOND source this filter cannot read, and it fails in a different way from the 401 above:
# the hub answers 200 and the sha resolves, so this pin is verified like every other one -- and
# the repository publishes its rows through a `helpful_instructions.py` loading script, which the
# pinned `datasets` 5.0.1 refuses outright ("Dataset scripts are no longer supported"). Reading it
# would mean unpinning the reader, which trades a named gap for an unnamed one.
#
# This is one of the four seeds the pinned attack dataset's own card names, so it is a real hole in
# the exclusion set and it is reported as one. It is NOT one of the two seeds a declared hop
# requires: no baseline's card declares training on it, so the build proceeds and names it.
availability = "unreadable"
http_status = 200
checked_on = "2026-08-29"
evidence = """\
hub API answered 200 with this sha, unauthenticated; datasets==5.0.1 refuses the repository with \
`RuntimeError: Dataset scripts are no longer supported, but found helpful_instructions.py`\
"""

