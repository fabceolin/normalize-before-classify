# Every remote artifact this project touches, named once, here.
#
# A repository id, a revision sha or a sample size that appears anywhere else in the code is a
# pin that can drift from this file without anyone noticing, so a test asserts none of them do.
# `src/nbc/pins.py` is the only module that reads this file.
#
# **A revision is not a pin on its own.** `protectai` ships two different `tokenizer.json` at
# the revision pinned below -- 8,656,744 bytes at the repository root and 8,648,886 bytes beside
# the ONNX graph -- and they declare different truncation: the root file carries
# `"truncation": {"max_length": 512}` and the one beside the graph carries `null` (both read at
# the pinned sha on 2026-08-28, re-read 2026-08-29). A pin that named only the revision would
# leave the choice between them to whichever loader convention the code happened to follow --
# and the root file truncates every long document at 512 before the window policy can fire,
# which is the confound `baselines/tokenization.py` exists to remove. Every artifact is
# therefore pinned by *path*.
#
# **Every value below was read from the live artifact at its pinned sha, not copied from a
# document.** `meta.verified_on` says when. Re-verify with `python -m nbc.pins --verify`.

[meta]
schema_version = 1
verified_on = "2026-08-28"
verified_against = """\
https://huggingface.co/api/{models,datasets}/<id>/revision/<sha>, plus the config.json, \
README.md and blob listing at that sha\
"""

# --- baselines -------------------------------------------------------------------------------
#
# Two is the floor of SC5 and the run sits exactly on it: fewer than two aborts, and two
# baselines declaring the same (architecture_family, tokenizer_family) pair also aborts, since
# the mechanism under suspicion is how encoded text tokenizes and two models that tokenize
# alike cannot corroborate each other.
#
# Both graphs are fp32. Where a repository publishes several precisions the fp32 graph is the
# pinned one and fp16 or mixed-precision graphs are never pinned: reduced precision moves
# scores in the last decimals and a hard threshold turns that into a class flip on exactly the
# borderline encoded items this experiment measures. Neither repository pinned here publishes a
# reduced-precision variant, so the rule currently has no subject -- it is enforced by a test
# rather than left as prose, because the subject arrives with the next pin, not the next reader.

[[baseline]]
key = "protectai-deberta-v3"
repository = "protectai/deberta-v3-base-prompt-injection-v2"
revision = "90c9989b1a342275dd0d1a95aad283c04e075671"
# The decision threshold is a declared parameter per baseline, applied in one place in
# `harness/measure.py` and written into `results.json`. 0.5 is the default and is a choice.
threshold = 0.5
# `onnx/`, not the root: the model card's own ONNX example loads with `subfolder="onnx"`, so the
# graph, the tokenizer exported beside it and its config travel together. Pinning the root
# tokenizer against the `onnx/` graph would pair two artifacts the publisher never paired.
graph_path = "onnx/model.onnx"
precision = "fp32"
# 738,563,188 bytes over ~184M parameters is 4 bytes per parameter, and `config.json` declares
# `torch_dtype: float32`. Recorded because it is the evidence for `precision`, not decoration.
graph_bytes = 738563188
tokenizer_path = "onnx/tokenizer.json"
config_path = "onnx/config.json"
architecture_family = "deberta-v2"
tokenizer_family = "sentencepiece-unigram"
# `shared` is AD-19's non-overlapping, max-reduced policy. It ships in the cell key from the
# first run even though it is currently the only value, because a key retro-fitted into a
# published envelope is a schema break.
window_policy = "shared"

[baseline.window]
# Read from the pinned revision's config, never from `tokenizer_config.json`, whose
# `model_max_length` is a ~1e30 sentinel in both pinned repositories.
length = 512
source = "onnx/config.json::max_position_embeddings"
# `config.json` is authoritative for *capacity*, not for *intent*: where a publisher's card
# declares an operative window smaller than the graph's positional capacity, the declared window
# is the one pinned. Distinguishing the two is a human reading, so it is confirmed once per change
# of pin -- and the revision is the gate rather than the date, because a pin can move on the same
# day and a date alone would let this keep looking fresh while describing a different artifact.
# This baseline's card declares no operative window, so the capacity is the window.
confirmed_on = "2026-08-28"
confirmed_revision = "90c9989b1a342275dd0d1a95aad283c04e075671"

[baseline.licence]
identifier = "apache-2.0"
source = """\
model card YAML `license:` at the pinned revision, and a LICENSE file in the repository\
"""
attribution = """\
protectai/deberta-v3-base-prompt-injection-v2, Protect AI, Apache-2.0, \
revision 90c9989b1a342275dd0d1a95aad283c04e075671\
"""
# The weights are fetched into the Hugging Face cache and never committed here, so this project
# does not redistribute them. The build-time licence abort is about rows that ARE redistributed.
redistributed = false

[baseline.lineage]
# What the baseline's card declares, read once and recorded as data so a rule can read it back.
# The date and the card revision are recorded so a check never re-run after a pin changed is
# visible, not assumed to hold: the file is refused when card_revision is not the pinned one.
checked_on = "2026-08-28"
card_revision = "90c9989b1a342275dd0d1a95aad283c04e075671"

[baseline.lineage.attack_datasets]
# The card names no pinned attack dataset among its training data, so tooth 1 passes.
# One hop does not come out clean, and this is the value that says so. The dataset's own card
# names VMware/open-instruct and jackhhao/jailbreak-classification among the four seeds it was
# built from, and this baseline declares training on both -- a reach no model card can show,
# because nothing on a model's card mentions a dataset built downstream of it. Measured on
# 2026-08-24, that reach was 3424 of 7066 unique benign rows and 515 of 3071 unique attacks.
# The benign figure is the serious one: half the counter-metric would have been text the primary
# baseline was taught to call safe.
# Declaring it here is not a way of excusing it. It is the statement that those rows are removed
# from the corpus before anything is measured, and it obliges the build to do so: every seed the
# reach runs through becomes a required exclusion source, derived from this file rather than
# restated beside it. Undeclared, the same reach aborts the run.
"xTRam1/safe-guard-prompt-injection" = "seeded-from-declared-training-source"

[baseline.lineage.training_sources]
# The card's `datasets:` block, verbatim, plus an explicit answer for every seed a pinned attack
# dataset names that the card does not. Silence is not admitted here: a source nobody answered
# for would read as "no reach" while meaning "nobody looked", which is precisely how the one-hop
# failure got through two rounds of card-reading.
"natolambert/xstest-v2-copy" = "trained-on"
"VMware/open-instruct" = "trained-on"
"alespalla/chatbot_instruction_prompts" = "trained-on"
"HuggingFaceH4/grok-conversation-harmless" = "trained-on"
"Harelix/Prompt-Injection-Mixed-Techniques-2024" = "trained-on"
"OpenSafetyLab/Salad-Data" = "trained-on"
"jackhhao/jailbreak-classification" = "trained-on"
# Named as seeds by the pinned dataset, absent from this card.
"HuggingFaceH4/helpful_instructions" = "not-declared"
"fka/awesome-chatgpt-prompts" = "not-declared"

[baseline.oq2]
# OQ2, the PRD's last open question: is this baseline strong enough on *clean* attack text for
# its degradation under encoding to mean anything? Measured before the corpus exists, by the
# spike named in `source`, over every attack positive the pinned dataset carries.
# `decided_revision` is the gate and the date is the metadata, as everywhere else in this file:
# a recall measured against a revision this file no longer pins is a check nobody re-ran, so a
# pin that moves makes this block name the new revision and the spike run again.
outcome = "kept"
decided_on = "2026-08-29"
decided_revision = "90c9989b1a342275dd0d1a95aad283c04e075671"
# 2569 of 3073 unique attack positives at threshold 0.5, 95% Wilson [0.8225, 0.8487].
clean_recall = 0.836
sample_size = 3073
source = "spikes/oq2_clean_recall.py"
# This number is an UPPER BOUND. This baseline declares `seeded-from-declared-training-source`
# against the pinned dataset below, and FR3.3's overlap filter -- which belongs to the corpus
# build, not to this spike -- has not removed those rows yet: roughly 515 of the unique attacks
# reach its training data at one hop. It is the lower of the two recalls even so.

[[baseline]]
key = "testsavantai-bert-small"
repository = "testsavantai/prompt-injection-defender-small-v0-onnx"
revision = "5bfc06f0b54950e6653f253eb7df1e3c9811b5cb"
threshold = 0.5
graph_path = "model.onnx"
precision = "fp32"
# 115,167,311 bytes over ~29M parameters, and `config.json` declares `torch_dtype: float32`.
graph_bytes = 115167311
# This repository ships exactly one `tokenizer.json`, at the root. The path is pinned anyway:
# the rule is that the pin names the file, not that it names it only where two exist.
tokenizer_path = "tokenizer.json"
config_path = "config.json"
# The card's metadata declares `base_model: microsoft/deberta-v3-base`. That is boilerplate
# inherited from a family card and it is wrong. The pinned revision's own `config.json` says
# `BertForSequenceClassification`, `model_type: bert`, `vocab_size: 30522`, and ships
# `vocab.txt` with no `spm.model`. The config is what was verified and the config is what is
# pinned, because a reviewer auditing SC5 from the cards alone would conclude both baselines are
# DeBERTa and that the independence this artifact rests on does not exist.
architecture_family = "bert"
tokenizer_family = "wordpiece"
window_policy = "shared"

[baseline.window]
length = 512
source = "config.json::max_position_embeddings"
# Same reading, same absence of a card-declared operative window, confirmed at this pin.
confirmed_on = "2026-08-28"
confirmed_revision = "5bfc06f0b54950e6653f253eb7df1e3c9811b5cb"

[baseline.licence]
# Read as found. There is no `license` key in the card's YAML, no `license:` tag on the model,
# and no LICENSE file in the repository at the pinned revision. Recording a guess here would be
# the exact defect the licence field exists to prevent, so the absence is declared instead.
identifier = "not-declared"
source = """\
no license key, no license tag and no LICENSE file at the pinned revision \
(checked 2026-08-28)\
"""
attribution = """\
testsavantai/prompt-injection-defender-small-v0-onnx, TestSavant.AI, licence not declared, \
revision 5bfc06f0b54950e6653f253eb7df1e3c9811b5cb\
"""
redistributed = false

[baseline.lineage]
checked_on = "2026-08-28"
card_revision = "5bfc06f0b54950e6653f253eb7df1e3c9811b5cb"

[baseline.lineage.attack_datasets]
# The card names no pinned attack dataset, and this baseline declares training on none of the
# four seeds that dataset was built from either, so it clears both teeth outright.
# `deepset/prompt-injections` is why that dataset is not an attack pool: dropping it is what
# returned this baseline to eligibility.
"xTRam1/safe-guard-prompt-injection" = "not-declared"

[baseline.lineage.training_sources]
# The card's `datasets:` block, verbatim.
"rubend18/ChatGPT-Jailbreak-Prompts" = "trained-on"
"deepset/prompt-injections" = "trained-on"
"Harelix/Prompt-Injection-Mixed-Techniques-2024" = "trained-on"
"JasperLS/prompt-injections" = "trained-on"
# The four seeds of the pinned attack dataset, none of which this card names.
"VMware/open-instruct" = "not-declared"
"HuggingFaceH4/helpful_instructions" = "not-declared"
"fka/awesome-chatgpt-prompts" = "not-declared"
"jackhhao/jailbreak-classification" = "not-declared"

[baseline.oq2]
# OQ2, the PRD's last open question: is this baseline strong enough on *clean* attack text for
# its degradation under encoding to mean anything? Measured before the corpus exists, by the
# spike named in `source`, over every attack positive the pinned dataset carries.
# `decided_revision` is the gate and the date is the metadata, as everywhere else in this file:
# a recall measured against a revision this file no longer pins is a check nobody re-ran, so a
# pin that moves makes this block name the new revision and the spike run again.
outcome = "kept"
decided_on = "2026-08-29"
decided_revision = "5bfc06f0b54950e6653f253eb7df1e3c9811b5cb"
# 2680 of 3073 unique attack positives at threshold 0.5, 95% Wilson [0.8598, 0.8835].
clean_recall = 0.8721
sample_size = 3073
source = "spikes/oq2_clean_recall.py"
# The PRD expected the obscure baseline to carry the OQ2 risk. It scored higher than the widely
# used one, on rows it declares no relationship to. That is the finding, and it is why this pin
# did not move.

# --- attack datasets -------------------------------------------------------------------------
#
# Identity only. The draw -- sample size in attack positives, selection method, and the seed or
# sort key it needs -- is declared by the story that builds the corpus, in this same file and in
# this same vocabulary. Until then nothing reads a sample size from anywhere, which is what the
# no-literals test asserts.

[[attack_dataset]]
key = "xtram1-safe-guard"
repository = "xTRam1/safe-guard-prompt-injection"
revision = "a3a877d608f37b7d20d9945671902df895ecdb46"
# Both, never one. Counts taken over a single split are the same error as counts taken over rows
# instead of attack positives, one level down.
splits = ["train", "test"]
# Verified against the pinned revision's rows rather than assumed from the field's name.
attack_label = 1

[attack_dataset.provenance]
# What this dataset's OWN card says it was built from. It is pinned here because the one-hop
# check reads it: a dataset seeded from a model's training data is that training data at one
# remove, and no model card reveals it.
# Read at the pinned revision on 2026-08-28, together with everything else in this file. The
# card_revision is the gate rather than the date -- a pin can move on the same day, and a date
# alone would let this declaration keep looking fresh while describing a different card.
checked_on = "2026-08-28"
card_revision = "a3a877d608f37b7d20d9945671902df895ecdb46"
# Four, as the card names them. Two of the four are declared training sources of the primary
# baseline, which is the reach recorded in that baseline's lineage block above.
# One property of this dataset a reader will find: its card presents the attack rows as
# synthetic, and roughly one in six is a literal row from a seed. That is an omission rather
# than a falsehood, and it is what reading a card for what a dataset is *for* misses.
seeds = [
    "VMware/open-instruct",
    "HuggingFaceH4/helpful_instructions",
    "fka/awesome-chatgpt-prompts",
    "jackhhao/jailbreak-classification",
]

[attack_dataset.licence]
# Also absent, and this one matters more: these rows are redistributed into `data/*.jsonl` in a
# public MIT repository. That makes it a build-time gate for the corpus story, and a decision a
# human has to make before the corpus ships -- not something this file can resolve by choosing a
# licence on the publisher's behalf.
identifier = "not-declared"
source = """\
no license key and no license tag on the dataset card at the pinned revision \
(checked 2026-08-28)\
"""
attribution = """\
xTRam1/safe-guard-prompt-injection, licence not declared, \
revision a3a877d608f37b7d20d9945671902df895ecdb46\
"""
redistributed = true
