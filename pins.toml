# --- the benign frame ---------------------------------------------------------------------------
#
# FR5.1's sampling frame: declared, hashed and frozen BEFORE anything is measured, because the
# objection this block exists to answer -- that the benign corpus was grown until the number looked
# reasonable -- is not answerable by a promise.
#
# `frame_id` is the SHA-256 of this whole block with `frame_id` itself removed, recomputed by
# `load_pins` on every read and refused on mismatch. Editing any field here without re-declaring the
# digest stops the run; editing it *with* a new digest is a visible diff against a corpus whose
# `data/manifest.json` still records the old one. `build_id`, computed in `corpus/manifest.py`,
# covers this block together with the attack draw, `CHAINS`, `HELDOUT_CHAINS` and the confirmatory
# cell, so an edit to the attack sample size cannot publish a table computed over the previous
# corpus with every check here still green.
#
# **500 per class, exactly, never "at least".** A class whose surviving material cannot fill it
# fails the build rather than topping up from another source: a frame that quietly substitutes
# sources is not a frame. That rule is enforced where the realized count exists, in
# `corpus/benign.py`, in both directions.

[benign_frame]
declared_on = "2026-08-29"

# Items per benign class. The two classes are reported separately and never pooled (FR3.1), so this
# is the n behind every B-code and every B-chat interval in the table.
#
# Why 500 rather than the attack draw's 1200: the attack pool is one dataset and a larger draw costs
# nothing but inference time, while each benign item is a fetched file or a filtered row and both
# classes must reach the number or the build stops. At p near 0.05 a Wilson half-width at n=500 is
# about 2 points, which is the resolution the false-positive half of the table needs to say
# something. Fixed here before anything was measured and hashed into `frame_id`.
sample_size_items = 500

# The same closed vocabulary as `[attack_dataset.draw]`, read by the same function
# (`pins._read_selection_method`), so "the same selection-method vocabulary as the attack draw" is
# a shared implementation rather than two declarations that happen to agree today. `head` needs a
# `sort_key` and refuses `seed`; `seeded_random` needs a `seed` and refuses `sort_key`.
method = "seeded_random"

# Deliberately not the attack draw's seed and not the OQ2 spike's. Three draws answering three
# questions that share an integer would invite a reader to think one reproduces another.
seed = 2718281

# The digest of everything above and below, recomputed at load. See the block header.
frame_id = "7703e504efbdf0907bdc2b39b8f3ed10d1bd05193ce898e91c137fd0243d4312"

[benign_frame.b_chat]
# The dataset is NOT named here: B-chat is drawn from the benign-labelled rows of the pinned attack
# dataset, whose identity `[[attack_dataset]]` already carries. A second copy of that repository id
# is a second place it can drift from, which is what this file's own header refuses.
#
# The rows are taken AFTER the training-overlap filter of FR3.3, never before. The measured reach of
# `VMware/open-instruct` alone is 3424 of 7066 unique benign rows -- 48% -- and three more declared
# seeds are unmeasured. If what survives cannot fill the class, the build fails and says by how
# much; it does not reach for another dataset.
#
# The hand-authored allowance, and its limit. FR5.1 restricts hand-authored material to what no
# public dataset carries: messages legitimately containing a JWT, a content hash, a data URI or an
# SSH public key. Those are exactly the legitimate encoded content a canonicalizer converts into
# false positives, and no conversational dataset carries them. The count is declared here and
# compared against what `src/nbc/corpus/sources/` actually holds, so an item added there without
# widening the frame fails the build rather than quietly enlarging the share of the counter-metric
# this repository wrote for itself. Five per kind, four kinds.
hand_authored_items = 20

[benign_frame.confirmatory_cell]
# FR5.4's single cell, declared here -- in the epic that builds the corpus -- and hashed into
# `build_id`, so it cannot have been chosen after the numbers existed. Emission and evaluation are
# the measurement epic's, and story 3.9 adds the assertion that the chain must be held out or nested
# past the recursion ceiling and never a bound one. This block is the declaration and the hash.
declared_on = "2026-08-29"
baseline = "protectai-deberta-v3"
# Four base64 links: `matrix.encoding_depth` is 4 against a declared ceiling of 3, so this cell sits
# past the ceiling rather than on a bound chain whose recovery is total by the story 3.4 contract.
dressing_chain = "base64+base64+base64+base64"
benign_class = "b_code"

[benign_frame.b_code]
# FR5.1's floor and cap, declared here and compared at load against `pins.MINIMUM_BENIGN_CODE_
# REPOSITORIES` and `pins.MAXIMUM_FILES_PER_BENIGN_CODE_REPOSITORY`. The reason is a design effect:
# files from one repository share a language, a style and a base64 idiom, so 500 files drawn 50 at a
# time from 10 repositories would carry an effective n near 150 and widen every B-code interval by
# roughly a factor of two while the reported n stayed 500. The REALIZED repository count and the
# per-repository counts are the builder's output and are written into `data/manifest.json`.
min_repositories = 50
max_files_per_repository = 10

# The file-eligibility rule, declared because it decides which files become corpus rows. The one
# admissible value means: the canonicalization layer's decode stage examines at least one run in
# this file. That is the sharpest available reading of the README's "code that legitimately embeds
# base64 or hex" -- the population where a decoding false positive can happen at all -- and it is
# measured against the layer rather than matched with a pattern of this file's own.
#
# What it costs, stated rather than hidden: B-code is therefore NOT a uniform sample of public
# source code, and its false-positive rate must not be read as one. It is a sample of source files
# the layer will actually try to decode.
eligibility = "layer_decode_candidate"

# The size band, in bytes of the undressed file. Both ends are substantive. Below the floor a file
# carries too little text for a classifier to have an opinion about; above the ceiling AD-19's
# max-over-windows policy turns length itself into false-positive probability, since a longer
# document is simply more windows and the document takes the maximum. A band declared here keeps
# that from being an uncontrolled variable of whichever files the draw happened to reach.
#
# The ceiling is 20000 because that is where the frame can be filled, measured rather than guessed.
# Over the 63 repositories pinned below, at their pinned shas, the number of eligible files after
# the 10-per-repository cap is:
#
#     band 200..4000    457 files over 61 repositories   -- SHORT of 500, the build would abort
#     band 200..8000    517 files over 62 repositories   -- 3% headroom
#     band 200..20000   573 files over 63 repositories   -- 15% headroom
#
# Measured on 2026-08-29 by streaming each archive and applying this frame's own eligibility rule.
# A band that only just reaches 500 makes the build fail the first time one repository is
# unreachable, which would be an abort about the network wearing the frame's clothes. The 15% is
# what separates "the frame could not be filled" from "one fetch went wrong".
min_file_bytes = 200
max_file_bytes = 20000

# Which paths are source files at all. Without this the draw reads lockfiles, minified bundles and
# vendored blobs, which are neither written by a human nor representative of the traffic FR3.1 is
# about. Matched against the path's own suffix, lowercased.
file_extensions = [
    ".c",
    ".cc",
    ".cpp",
    ".cs",
    ".go",
    ".h",
    ".java",
    ".js",
    ".jsx",
    ".py",
    ".rb",
    ".rs",
    ".sh",
    ".ts",
    ".tsx",
]

# The repositories, pinned by repository and commit sha, each with the licence read from its own
# licence file at that sha. Selected under the three criteria the README states: permissively
# licensed, containing code that legitimately embeds base64 or hex, and NOT security or guardrail
# repositories. The first is recorded here and becomes a build abort in story 3.8; the third is a
# human reading, and the only part of it this file can enforce is that none of these is also a
# pinned baseline, attack pool or exclusion source, which `load_pins` refuses.
#
# These are git repositories on GitHub, not Hugging Face artifacts, so they are deliberately absent
# from `remote_artifacts()` and from `python -m nbc.pins --verify`: that resolver asks the Hugging
# Face API about an id, and asking it about `psf/requests` would report a pin as unresolvable that
# was never its to resolve. What verifies these is the build, which fetches the archive AT THIS SHA
# and gets a 404 rather than a branch head if the sha has gone.
#
# More repositories are pinned than the floor requires. A repository that yields no eligible file
# contributes nothing, and the floor is checked against the REALIZED count, so the headroom is what
# keeps a single unreachable repository from being the difference between a corpus and an abort.

[exclusion_source.licence]
identifier = "cc0-1.0"
source = """\
card YAML `license:` at the pinned revision (checked 2026-08-29)\
"""
attribution = """\
fka/awesome-chatgpt-prompts, cc0-1.0, revision e6da2332534f7b940358dc167fce4cbcdabae486\
"""
# An exclusion source's rows are intersected against the corpus and every match is
# REMOVED, so no byte of one reaches data/. Declared anyway, because AD-34's rule is that
# every pinned source carries a licence, and a source whose licence nobody read is a
# source nobody could redistribute from later without repeating this reading.
redistributed = false

